[package]
name = "scriptopotamus"
version = "0.6.2"
edition = "2024"
default-run = "scrippo-core"

[[bin]]
name = "scrippo-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1.10"
thiserror = "2"
tempfile = "3"
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
